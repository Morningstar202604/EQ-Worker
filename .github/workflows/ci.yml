name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: 构建 + 单测 + 产物一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建（自动同步 Android/桌面端产物并校验一致）
        run: node build.js

      - name: 单元测试
        run: node --test

      - name: 产物必须与源码同步（防止「改了 _app_dev.js 却忘了重新构建」）
        run: |
          node build.js
          if ! git diff --quiet -- index.html EQ-Worker.html android/app/src/main/assets/index.html desktop/index.html; then
            echo "::error::构建产物与源码不同步，请本地执行 node build.js 后一并提交"
            git diff --stat -- index.html EQ-Worker.html android/app/src/main/assets/index.html desktop/index.html
            exit 1
          fi

      - name: 小程序配置文件 JSON 合法性
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob('EQ-Worker-小程序/**/*.json', recursive=True):
              if 'node_modules' in f: continue
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('::error::以下 JSON 文件非法:'); [print(' -', b) for b in bad]; sys.exit(1)
          print('小程序 JSON 校验通过')
          PY

      - name: 密钥泄漏自查
        run: |
          if grep -rInE "(ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
               --include="*.js" --include="*.html" --include="*.md" --include="*.json" --include="*.yml" \
               --exclude-dir=node_modules . ; then
            echo "::error::检测到疑似密钥，请立即吊销并改用环境变量/凭据存储"
            exit 1
          fi
          echo "未发现硬编码密钥"
