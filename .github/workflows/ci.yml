name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建 + 测试 + 产物一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本一致性（防漂移）
        run: node scripts/sync-version.mjs

      - name: Lint
        run: pnpm run lint

      - name: 构建全部产物
        run: |
          node build.js
          node scripts/build-mini-core.mjs
          node scripts/build-cli.mjs
          node scripts/build-server.mjs
          node scripts/build-mcp.mjs

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试（Node）
        run: node scripts/run-tests.mjs --exclude-e2e

      - name: 单元测试（Vitest）+ 覆盖率门槛
        run: pnpm run test:coverage

      - name: 产物必须与源码同步
        run: |
          # 只核对入库的构建产物；desktop/index.html 是打包时才生成的，不在此列
          FILES="index.html EQ-Worker.html android/app/src/main/assets/index.html EQ-Worker-小程序/utils/core.bundle.js"
          if ! git diff --quiet -- $FILES; then
            echo "::error::构建产物与源码不同步，请本地执行 node build.js 和 node scripts/build-mini-core.mjs 后一并提交"
            git diff --stat -- $FILES
            exit 1
          fi

      - name: 小程序配置 JSON 合法性
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob('EQ-Worker-小程序/**/*.json', recursive=True):
              if 'node_modules' in f: continue
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('::error::以下 JSON 文件非法:')
              [print(' -', b) for b in bad]
              sys.exit(1)
          print('小程序 JSON 全部合法')
          PY

      - name: 硬编码密钥扫描
        run: |
          set +e
          # vendor/ 是第三方发行版（html2canvas 等），压缩代码里会出现形似密钥的长串；
          # 与我们自己的代码无关，排除掉才能让这条门禁只在自有代码上报警。
          HITS=$(grep -rniE "ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN.*PRIVATE KEY" \
            --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=dist-vite --exclude-dir=dist-studio \
            --exclude-dir=dist-cli --exclude-dir=dist-server --exclude-dir=dist-mcp \
            --exclude-dir=vendor \
            . 2>/dev/null | grep -vE "index\.html|EQ-Worker\.html|LICENSES")
          if [ -n "$HITS" ]; then
            echo "::error::检出疑似硬编码密钥"
            echo "$HITS"
            exit 1
          fi
          echo "未发现硬编码密钥"

      - name: 依赖审计
        run: pnpm audit --registry=https://registry.npmjs.org --audit-level=high

  e2e:
    name: E2E（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium
      - name: 构建被测产物
        run: |
          node build.js
          npx vite build --config vite.studio.config.ts
      - name: 运行 E2E
        run: node --test tests/e2e.test.mjs

  desktop:
    name: Windows 安装包
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # 默认 GITHUB_TOKEN 对 contents 常常是只读，gh release upload 会被拒。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node build.js
      - name: 生成图标
        run: node scripts/make-ico.mjs
      - name: 打包 NSIS
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: EQ-Worker-windows-x64
          path: desktop/dist/*.exe
          retention-days: 30
      - name: 附加到 Release
        # workflow_dispatch 时没有 tag 名可用，用 package.json 的版本拼出 v 前缀
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 115MB 安装包从本地直传 GitHub 会因上行慢被服务端判超时；
          # runner 的出网条件正常，由 CI 在打 tag 时附加到同名 Release 更可靠。
          # 直接读 package.json，避免 ref_name 在 dispatch 时是分支名而非 tag。
          TAG="v$(node -p "require('./package.json').version")"
          EXE=$(ls desktop/dist/*.exe | head -1)
          echo "附加 $EXE 到 Release $TAG"
          gh release view "$TAG" || gh release create "$TAG" --title "EQ-Worker $TAG" --notes-file release/RELEASE-3.5.0.md
          gh release upload "$TAG" "$EXE" --clobber
